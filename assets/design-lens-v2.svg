<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Design lens for a textile item</title><desc id="desc">A design decision links user and end use with functional and aesthetic requirements, then checks relevant factors.</desc>
  <rect width="920" height="500" rx="26" fill="#f8f3eb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><circle cx="460" cy="250" r="92" fill="#a84d3f"/><text x="460" y="240" fill="#fff" font-size="25" font-weight="700">TEXTILE</text><text x="460" y="273" fill="#fff" font-size="25" font-weight="700">DECISION</text>
  <rect x="50" y="75" width="270" height="120" rx="18" fill="#fff" stroke="#163b55" stroke-width="4"/><text x="185" y="119" fill="#163b55" font-size="24" font-weight="700">USER + END USE</text><text x="185" y="153" fill="#293946" font-size="17">Who will use it?</text><text x="185" y="178" fill="#293946" font-size="17">What must it do?</text>
  <rect x="600" y="55" width="270" height="140" rx="18" fill="#fff" stroke="#a17a2d" stroke-width="4"/><text x="735" y="100" fill="#70541e" font-size="24" font-weight="700">FUNCTIONAL</text><text x="735" y="134" fill="#293946" font-size="17">fit · comfort · strength</text><text x="735" y="160" fill="#293946" font-size="17">care · movement · protection</text>
  <rect x="600" y="315" width="270" height="130" rx="18" fill="#fff" stroke="#a84d3f" stroke-width="4"/><text x="735" y="361" fill="#863b31" font-size="24" font-weight="700">AESTHETIC</text><text x="735" y="395" fill="#293946" font-size="17">colour · shape · texture</text><text x="735" y="421" fill="#293946" font-size="17">style · visual effect</text>
  <rect x="50" y="305" width="270" height="150" rx="18" fill="#fff" stroke="#55705f" stroke-width="4"/><text x="185" y="346" fill="#3f5b49" font-size="24" font-weight="700">FACTORS</text><text x="185" y="380" fill="#293946" font-size="17">materials · resources · cost</text><text x="185" y="408" fill="#293946" font-size="17">time · technology · society</text><text x="185" y="436" fill="#293946" font-size="16">environmental impact</text></g>
  <g stroke="#4f5b64" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M320 135C375 143 400 175 416 198"/><path d="M600 132C546 145 515 177 500 204"/><path d="M600 376C546 355 516 323 498 296"/><path d="M320 377C375 354 399 324 418 296"/></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#4f5b64"/></marker></defs>
</svg>
