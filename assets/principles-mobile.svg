<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1510" role="img" aria-labelledby="title desc">
  <title id="title">Seven principles of textile design for narrow screens</title>
  <desc id="desc">Seven stacked panels separately show balance, rhythm, emphasis, contrast, harmony, proportion and unity, with a short explanation of each relationship.</desc>
  <rect width="420" height="1510" rx="28" fill="#f8f3eb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#162431">
    <g transform="translate(30 30)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><circle cx="125" cy="72" r="34" fill="#a84d3f"/><circle cx="235" cy="72" r="34" fill="#a84d3f"/><text x="180" y="132" font-size="23" font-weight="700">BALANCE</text><text x="180" y="163" font-size="18">Distribute visual weight</text></g>
    <g transform="translate(30 240)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><path d="M88 108h34V70H88zm50 0h34V44h-34zm50 0h34V70h-34zm50 0h34V44h-34z" fill="#a17a2d"/><text x="180" y="132" font-size="23" font-weight="700">RHYTHM</text><text x="180" y="163" font-size="18">Repeat, alternate or progress</text></g>
    <g transform="translate(30 450)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><circle cx="105" cy="72" r="20" fill="#cbbfb5"/><circle cx="180" cy="72" r="48" fill="#a84d3f"/><circle cx="255" cy="72" r="20" fill="#cbbfb5"/><text x="180" y="132" font-size="23" font-weight="700">EMPHASIS</text><text x="180" y="163" font-size="18">Create a focal point</text></g>
    <g transform="translate(30 660)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><rect x="90" y="40" width="78" height="78" fill="#163b55"/><rect x="192" y="40" width="78" height="78" fill="#f1c66f"/><text x="180" y="144" font-size="23" font-weight="700">CONTRAST</text><text x="180" y="174" font-size="18">Make differences noticeable</text></g>
    <g transform="translate(30 870)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><rect x="90" y="40" width="78" height="78" rx="12" fill="#a84d3f"/><rect x="192" y="40" width="78" height="78" rx="12" fill="#d98b58"/><text x="180" y="144" font-size="23" font-weight="700">HARMONY</text><text x="180" y="174" font-size="18">Create compatible relationships</text></g>
    <g transform="translate(30 1080)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><rect x="110" y="68" width="48" height="66" fill="#55705f"/><rect x="182" y="40" width="92" height="94" fill="#55705f"/><text x="180" y="158" font-size="23" font-weight="700">PROPORTION</text><text x="180" y="184" font-size="18">Relate the size of parts</text></g>
    <g transform="translate(30 1290)"><rect width="360" height="190" rx="20" fill="#fff" stroke="#d7cbc0"/><path d="M82 112l54-62 44 42 44-42 54 62" fill="none" stroke="#a84d3f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="146" font-size="23" font-weight="700">UNITY</text><text x="180" y="176" font-size="18">Make the parts belong together</text></g>
  </g>
</svg>
