<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Seven principles organise textile design elements</title>
  <desc id="desc">Seven labelled panels separately show balance, rhythm, emphasis, contrast, harmony, proportion and unity, with a short explanation of each relationship.</desc>
  <rect width="920" height="620" rx="26" fill="#f8f3eb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#162431">
    <g transform="translate(25 28)"><rect width="205" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><circle cx="63" cy="92" r="34" fill="#a84d3f"/><circle cx="142" cy="92" r="34" fill="#a84d3f"/><text x="102.5" y="164" font-size="20" font-weight="700">BALANCE</text><text x="102.5" y="197" font-size="15">Distribute visual</text><text x="102.5" y="219" font-size="15">weight</text></g>
    <g transform="translate(245 28)"><rect width="205" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><path d="M30 118h28V78H30zm39 0h28V50H69zm39 0h28V78h-28zm39 0h28V50h-28z" fill="#a17a2d"/><text x="102.5" y="164" font-size="20" font-weight="700">RHYTHM</text><text x="102.5" y="197" font-size="15">Repeat, alternate</text><text x="102.5" y="219" font-size="15">or progress</text></g>
    <g transform="translate(465 28)"><rect width="205" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><circle cx="50" cy="90" r="18" fill="#cbbfb5"/><circle cx="102.5" cy="90" r="48" fill="#a84d3f"/><circle cx="155" cy="90" r="18" fill="#cbbfb5"/><text x="102.5" y="164" font-size="20" font-weight="700">EMPHASIS</text><text x="102.5" y="197" font-size="15">Create a focal</text><text x="102.5" y="219" font-size="15">point</text></g>
    <g transform="translate(685 28)"><rect width="205" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><rect x="32" y="56" width="62" height="72" fill="#163b55"/><rect x="111" y="56" width="62" height="72" fill="#f1c66f"/><text x="102.5" y="164" font-size="20" font-weight="700">CONTRAST</text><text x="102.5" y="197" font-size="15">Make differences</text><text x="102.5" y="219" font-size="15">noticeable</text></g>
    <g transform="translate(80 330)"><rect width="240" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><rect x="42" y="60" width="72" height="72" rx="12" fill="#a84d3f"/><rect x="126" y="60" width="72" height="72" rx="12" fill="#d98b58"/><text x="120" y="168" font-size="20" font-weight="700">HARMONY</text><text x="120" y="201" font-size="15">Create compatible</text><text x="120" y="223" font-size="15">relationships</text></g>
    <g transform="translate(340 330)"><rect width="240" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><rect x="48" y="80" width="48" height="68" fill="#55705f"/><rect x="116" y="50" width="92" height="98" fill="#55705f"/><text x="120" y="168" font-size="20" font-weight="700">PROPORTION</text><text x="120" y="201" font-size="15">Relate the size</text><text x="120" y="223" font-size="15">of parts</text></g>
    <g transform="translate(600 330)"><rect width="240" height="255" rx="18" fill="#fff" stroke="#d7cbc0"/><path d="M42 132l42-54 36 36 36-36 42 54" fill="none" stroke="#a84d3f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="168" font-size="20" font-weight="700">UNITY</text><text x="120" y="201" font-size="15">Make the parts</text><text x="120" y="223" font-size="15">belong together</text></g>
  </g>
</svg>
