<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">Four elements of textile design</title><desc id="desc">Four panels illustrate line and direction, shape and size, texture, and colour and value.</desc><rect width="920" height="500" rx="26" fill="#f8f3eb"/><g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(40 50)"><rect width="190" height="360" rx="18" fill="#fff" stroke="#d7cbc0"/><path d="M25 95h140M25 135l140 80M25 255h140" stroke="#a84d3f" stroke-width="12"/><text x="95" y="315" font-size="22" font-weight="700" fill="#162431">LINE +</text><text x="95" y="344" font-size="22" font-weight="700" fill="#162431">DIRECTION</text></g><g transform="translate(255 50)"><rect width="190" height="360" rx="18" fill="#fff" stroke="#d7cbc0"/><circle cx="67" cy="125" r="38" fill="#163b55"/><rect x="95" y="155" width="68" height="112" rx="8" fill="#a17a2d"/><text x="95" y="315" font-size="22" font-weight="700" fill="#162431">SHAPE +</text><text x="95" y="344" font-size="22" font-weight="700" fill="#162431">SIZE</text></g><g transform="translate(470 50)"><rect width="190" height="360" rx="18" fill="#fff" stroke="#d7cbc0"/><path d="M20 100q30-45 60 0t60 0 30 0M20 145q30-45 60 0t60 0 30 0M20 190q30-45 60 0t60 0 30 0M20 235q30-45 60 0t60 0 30 0" fill="none" stroke="#55705f" stroke-width="8"/><text x="95" y="329" font-size="22" font-weight="700" fill="#162431">TEXTURE</text></g><g transform="translate(685 50)"><rect width="190" height="360" rx="18" fill="#fff" stroke="#d7cbc0"/><rect x="25" y="90" width="140" height="48" fill="#f1c66f"/><rect x="25" y="138" width="140" height="48" fill="#d98b58"/><rect x="25" y="186" width="140" height="48" fill="#a84d3f"/><rect x="25" y="234" width="140" height="48" fill="#5a2935"/><text x="95" y="315" font-size="22" font-weight="700" fill="#162431">COLOUR +</text><text x="95" y="344" font-size="22" font-weight="700" fill="#162431">VALUE</text></g></g></svg>
