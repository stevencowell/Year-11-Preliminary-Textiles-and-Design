<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 940" role="img" aria-labelledby="title desc">
  <title id="title">Design lens sequence for a textile item</title>
  <desc id="desc">A four-step sequence starts with the user and end use, identifies functional and aesthetic requirements, checks relevant design factors, then makes a supported textile decision.</desc>
  <rect width="420" height="940" rx="28" fill="#f6efe5"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(30 30)"><rect width="360" height="160" rx="20" fill="#fff" stroke="#163b55" stroke-width="4"/><circle cx="36" cy="38" r="22" fill="#163b55"/><text x="36" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="70" y="48" fill="#163b55" font-size="23" font-weight="700">USER + END USE</text><text x="28" y="95" fill="#293946" font-size="19">Who will use the item?</text><text x="28" y="126" fill="#293946" font-size="19">What must it do?</text></g>
    <path d="M210 198v48" stroke="#566571" stroke-width="8" stroke-linecap="round"/><path d="M192 232l18 22 18-22" fill="none" stroke="#566571" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(30 258)"><rect width="360" height="238" rx="20" fill="#fff" stroke="#a17a2d" stroke-width="4"/><circle cx="36" cy="38" r="22" fill="#a17a2d"/><text x="36" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="70" y="48" fill="#70541e" font-size="23" font-weight="700">REQUIREMENTS</text><text x="28" y="94" fill="#70541e" font-size="19" font-weight="700">FUNCTIONAL</text><text x="28" y="124" fill="#293946" font-size="17">fit · comfort · strength</text><text x="28" y="150" fill="#293946" font-size="17">care · movement · protection</text><text x="28" y="188" fill="#863b31" font-size="19" font-weight="700">AESTHETIC</text><text x="28" y="218" fill="#293946" font-size="17">colour · shape · texture · style</text></g>
    <path d="M210 504v48" stroke="#566571" stroke-width="8" stroke-linecap="round"/><path d="M192 538l18 22 18-22" fill="none" stroke="#566571" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(30 564)"><rect width="360" height="178" rx="20" fill="#fff" stroke="#55705f" stroke-width="4"/><circle cx="36" cy="38" r="22" fill="#55705f"/><text x="36" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="70" y="48" fill="#3f5b49" font-size="23" font-weight="700">DESIGN FACTORS</text><text x="28" y="96" fill="#293946" font-size="17">materials · resources · cost · time</text><text x="28" y="126" fill="#293946" font-size="17">technology · society · environment</text><text x="28" y="156" fill="#293946" font-size="17">Recognise, balance and justify.</text></g>
    <path d="M210 750v48" stroke="#566571" stroke-width="8" stroke-linecap="round"/><path d="M192 784l18 22 18-22" fill="none" stroke="#566571" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(30 810)"><rect width="360" height="100" rx="20" fill="#a84d3f"/><circle cx="36" cy="38" r="22" fill="#fff"/><text x="36" y="46" text-anchor="middle" fill="#a84d3f" font-size="20" font-weight="700">4</text><text x="70" y="45" fill="#fff" font-size="23" font-weight="700">TEXTILE DECISION</text><text x="70" y="75" fill="#fff" font-size="17">Connect the evidence to purpose.</text></g>
  </g>
</svg>
