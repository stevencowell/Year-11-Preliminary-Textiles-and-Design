<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Careers and training reasoning map</title><desc id="desc">Create a career-pathway map linking textile industry role areas to relevant skills, evidence of developing capability and flexible pathways through school, VET, diploma or advanced diploma study, university and workplace experience, ending with a checkpoint to verify current provider requirements.</desc>
